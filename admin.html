<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>管理员 - 授权码管理</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, sans-serif; background: #0a0a0a; color: #fff; padding: 24px; }
    .wrap { max-width: 800px; margin: 0 auto; }
    h2 { margin-top: 0; color: #ff3366; }
    .card { background: #151515; border: 1px solid #222; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card h3 { margin-top: 0; color: #fff; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; margin-top: 14px; }
    label:first-child { margin-top: 0; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: #ff3366; }
    button { background: linear-gradient(135deg, #ff3366, #ff6b9d); border: none; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #333; margin-top: 10px; }
    
    table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; margin-top: 12px; font-size: 14px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #222; }
    th { background: #222; color: #ff6b9d; font-weight: 600; }
    .code-cell { font-family: monospace; font-size: 15px; letter-spacing: 1px; color: #fff; }
    
    .status-used { color: #ff4444; }
    .status-active { color: #00ff88; }
    
    /* 单个查询结果卡片 */
    .single-result { display: none; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-top: 15px; }
    .single-result .label { color: #888; font-size: 12px; }
    .single-result .value { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .single-result .value.code { color: #ff6b9d; font-family: monospace; letter-spacing: 2px; }
    
    .tip { font-size: 12px; color: #666; margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="wrap">
  <h2>🔐 授权码管理中心</h2>

  <!-- 1. 生成区域 -->
  <div class="card">
    <h3>1. 批量生成新授权码</h3>
    <label>管理员密码</label>
    <input type="password" id="passGen" placeholder="请输入管理员密码">

    <div style="display:flex; gap:15px;">
      <div style="flex:1;">
        <label>生成数量 (1-100)</label>
        <input type="number" id="count" value="10" min="1" max="100">
      </div>
      <div style="flex:1;">
        <label>单码测试次数</label>
        <select id="attempts">
          <option value="1">1 次</option>
          <option value="2">2 次</option>
          <option value="3">3 次</option>
          <option value="5">5 次</option>
        </select>
      </div>
    </div>

    <button onclick="generate()" id="genBtn">生成授权码</button>

    <div id="genResult" style="display:none; margin-top:20px;">
      <h4 style="color:#00ff88; font-size:14px;">✅ 生成成功，请复制下表保存到 Excel</h4>
      <button class="btn-secondary" style="width:auto; padding:8px 16px; font-size:13px; margin-top:10px;" onclick="copyTable('genTableBody')">📋 复制表格</button>
      <table>
        <thead><tr><th>授权码</th><th>测试次数</th><th>生成时间</th></tr></thead>
        <tbody id="genTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 2. 精准查询单个 -->
  <div class="card">
    <h3>2. 精准查询单个授权码状态</h3>
    <label>管理员密码</label>
    <input type="password" id="passSingle" placeholder="请输入管理员密码">
    <label>要查询的授权码 (6位)</label>
    <input type="text" id="queryCode" maxlength="6" placeholder="例如: A7K9M2" style="text-transform:uppercase; letter-spacing:2px;">
    
    <button class="btn-secondary" onclick="querySingle()" id="querySingleBtn" style="background:#444;">🔍 查询该授权码</button>

    <div id="singleResultCard" class="single-result">
      <div class="label">授权码</div>
      <div class="value code" id="resCode">--</div>
      <div style="display:flex; gap:20px; margin-top:10px;">
        <div style="flex:1;">
          <div class="label">总次数</div>
          <div class="value" id="resMax" style="color:#fff;">--</div>
        </div>
        <div style="flex:1;">
          <div class="label">已使用</div>
          <div class="value" id="resUsed" style="color:#ff6b9d;">--</div>
        </div>
        <div style="flex:1;">
          <div class="label">剩余次数</div>
          <div class="value" id="resRemain" style="color:#00ff88;">--</div>
        </div>
      </div>
      <div class="label" style="margin-top:10px;">生成时间</div>
      <div class="value" id="resTime" style="font-size:14px; font-weight:normal; color:#aaa;">--</div>
    </div>
  </div>

  <!-- 3. 批量查询所有 -->
  <div class="card">
    <h3>3. 批量查询所有已生成记录</h3>
    <label>管理员密码</label>
    <input type="password" id="passAll" placeholder="请输入管理员密码">
    <p style="color:#888; font-size:13px; margin:10px 0;">点击下方按钮，读取数据库中所有授权码的使用状态（最多显示最新 200 条）。</p>
    
    <button class="btn-secondary" onclick="queryAll()" id="queryAllBtn" style="background:#444;">🔄 刷新全部状态列表</button>
    
    <div id="listResult" style="display:none; margin-top:20px;">
      <button class="btn-secondary" style="width:auto; padding:8px 16px; font-size:13px;" onclick="copyTable('listTableBody')">📋 复制状态表</button>
      <table>
        <thead><tr><th>授权码</th><th>总次数</th><th>已用 / 剩余</th><th>状态</th><th>生成时间</th></tr></thead>
        <tbody id="listTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="tip">
    💡 <strong>排错提示：</strong>如果点击按钮一直提示“网络错误”，请按键盘 <strong>F12</strong> 打开浏览器控制台，查看红色的具体报错信息。通常是因为 KV 数据库未绑定，或 functions 文件夹层级错误。
  </div>
</div>

<script>
// 辅助函数：处理 API 响应
async function handleApi(url, body) {
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// 1. 生成
async function generate() {
  const pass = document.getElementById('passGen').value;
  if (!pass) return alert('请输入密码');

  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.innerText = '生成中...';

  try {
    const data = await handleApi('/api/generate', {
      password: pass,
      count: parseInt(document.getElementById('count').value),
      attempts: parseInt(document.getElementById('attempts').value)
    });
    
    const tbody = document.getElementById('genTableBody');
    tbody.innerHTML = '';
    const now = new Date().toLocaleString('zh-CN');
    data.codes.forEach(item => {
      tbody.innerHTML += `<tr><td class="code-cell">${item.code}</td><td>${item.max} 次</td><td>${now}</td></tr>`;
    });
    document.getElementById('genResult').style.display = 'block';
  } catch (e) {
    alert('生成失败: ' + e.message);
    console.error(e);
  } finally {
    btn.disabled = false; btn.innerText = '生成授权码';
  }
}

// 2. 查询单个
async function querySingle() {
  const pass = document.getElementById('passSingle').value;
  const code = document.getElementById('queryCode').value.trim();
  if (!pass || !code) return alert('请输入密码和授权码');

  const btn = document.getElementById('querySingleBtn');
  btn.disabled = true; btn.innerText = '查询中...';
  document.getElementById('singleResultCard').style.display = 'none';

  try {
    const data = await handleApi('/api/query', { password: pass, code: code });
    if (data.type === 'single') {
      document.getElementById('resCode').innerText = data.data.code;
      document.getElementById('resMax').innerText = data.data.max;
      document.getElementById('resUsed').innerText = data.data.used;
      document.getElementById('resRemain').innerText = data.data.remaining;
      document.getElementById('resTime').innerText = data.data.created;
      document.getElementById('singleResultCard').style.display = 'block';
    }
  } catch (e) {
    alert('查询失败: ' + e.message);
    console.error(e);
  } finally {
    btn.disabled = false; btn.innerText = '🔍 查询该授权码';
  }
}

// 3. 查询所有
async function queryAll() {
  const pass = document.getElementById('passAll').value;
  if (!pass) return alert('请输入密码');

  const btn = document.getElementById('queryAllBtn');
  btn.disabled = true; btn.innerText = '读取中...';

  try {
    const data = await handleApi('/api/query', { password: pass }); // 不传 code 即为查全部
    if (data.type === 'all') {
      const tbody = document.getElementById('listTableBody');
      tbody.innerHTML = '';
      data.list.forEach(item => {
        const statusClass = item.remaining > 0 ? 'status-active' : 'status-used';
        const statusText = item.remaining > 0 ? `可用 (剩${item.remaining})` : '已用完';
        tbody.innerHTML += `
          <tr>
            <td class="code-cell">${item.code}</td>
            <td>${item.max}</td>
            <td
