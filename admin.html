<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>管理员 - 授权码生成器</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, sans-serif; background: #0a0a0a; color: #fff; padding: 24px; }
    .wrap { max-width: 700px; margin: 0 auto; }
    h2 { margin-top: 0; color: #ff3366; }
    .card { background: #151515; border: 1px solid #222; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; margin-top: 14px; }
    label:first-child { margin-top: 0; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: #ff3366; }
    button { background: linear-gradient(135deg, #ff3366, #ff6b9d); border: none; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    .result-area { display: none; }
    .result-area h3 { color: #ff6b9d; margin-bottom: 12px; }
    .copy-btn { background: #333; width: auto; padding: 8px 16px; font-size: 13px; margin: 10px 0; }
    table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; margin-top: 12px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #222; font-size: 14px; }
    th { background: #222; color: #ff6b9d; font-weight: 600; }
    .code-cell { font-family: monospace; font-size: 16px; letter-spacing: 2px; color: #fff; }
    .tip { font-size: 12px; color: #666; margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="wrap">
  <h2>🔐 授权码管理中心</h2>

  <div class="card">
    <label>管理员密码</label>
    <input type="password" id="pass" value="soul2026">

    <label>生成数量（1-100）</label>
    <input type="number" id="count" value="10" min="1" max="100">

    <label>每个授权码的测试次数（商业设置）</label>
    <select id="attempts">
      <option value="1">1 次（一次性，最常用）</option>
      <option value="2">2 次</option>
      <option value="3">3 次</option>
      <option value="5">5 次</option>
    </select>

    <button onclick="generate()">生成授权码</button>
  </div>

  <div class="card result-area" id="resultArea">
    <h3>✅ 生成成功</h3>
    <button class="copy-btn" onclick="copyTable()">📋 复制表格（粘贴到 Excel）</button>
    <table id="codeTable">
      <thead>
        <tr><th>授权码</th><th>测试次数</th><th>生成时间</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="tip">
      💡 <strong>使用说明：</strong><br>
      1. 点击"复制表格"按钮，粘贴到 Excel 保存，这就是你的本地记录<br>
      2. 把授权码发给用户，用户访问主页输入码即可测试<br>
      3. 用户测试完成后，码自动标记为已使用（次数减 1）<br>
      4. 次数用完后，用户只能查看最后一次的结果海报<br>
      5. 随时可以回来再次生成新的授权码批次
    </div>
  </div>
</div>

<script>
async function generate() {
  const pass = document.getElementById('pass').value;
  const count = parseInt(document.getElementById('count').value);
  const attempts = parseInt(document.getElementById('attempts').value);

  if (!pass) return alert('请输入密码');
  if (count < 1 || count > 100) return alert('数量必须 1-100');

  const btn = document.querySelector('button');
  btn.disabled = true;
  btn.innerText = '生成中...';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass, count, attempts })
    });
    const data = await res.json();

    if (data.success) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      const now = new Date().toLocaleString('zh-CN');
      data.codes.forEach(item => {
        tbody.innerHTML += `<tr><td class="code-cell">${item.code}</td><td>${item.max} 次</td><td>${now}</td></tr>`;
      });
      document.getElementById('resultArea').style.display = 'block';
    } else {
      alert('错误：' + data.error);
    }
  } catch (e) {
    alert('网络错误');
  } finally {
    btn.disabled = false;
    btn.innerText = '生成授权码';
  }
}

function copyTable() {
  let text = '授权码\t测试次数\t生成时间\n';
  document.querySelectorAll('#tableBody tr').forEach(tr => {
    text += tr.innerText.replace(/\n/g, '\t') + '\n';
  });
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ 已复制到剪贴板！\n请打开 Excel，按 Ctrl+V 粘贴保存。');
  }).catch(() => {
    alert('复制失败，请手动选择表格内容复制');
  });
}
</script>
</body>
</html>
